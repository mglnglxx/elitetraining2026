<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Habilidades Directivas — Elite Training</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="description" content="Portafolio de capacitación en habilidades directivas para la industria: toma de decisiones, gestión de proyectos y liderazgo técnico.">
    <meta property="og:title" content="Portafolio Habilidades Directivas — Elite Training">
    <meta property="og:description" content="Formación en toma de decisiones, gestión de proyectos y liderazgo técnico para la industria.">
    <meta property="og:image" content="https://landing.hidrocarburos.com.co/assets/logos/elite-training.svg">
    <meta property="og:url" content="https://landing.hidrocarburos.com.co/portafolio-habilidades">
    <meta property="og:type" content="website">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        html,body{height:100%;overflow:hidden;background:#1a1a1a;}
        .toolbar{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px;background:#2D3670;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;}
        .toolbar a{color:#fff;text-decoration:none;padding:8px 16px;border-radius:6px;background:rgba(255,255,255,0.15);transition:background 0.2s;}
        .toolbar a:hover{background:rgba(255,255,255,0.25);}
        iframe{width:100%;height:calc(100% - 48px);display:block;border:none;}
        .fallback{display:none;color:#fff;text-align:center;padding:60px 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
        .fallback a{color:#D4A230;font-size:18px;}
    </style>
</head>
<body>
    <div class="toolbar">
        <span>Portafolio Habilidades Directivas — Elite Training</span>
        <a href="portafolio-habilidades.pdf" download>Descargar PDF ↓</a>
    </div>
    <iframe id="pdfViewer" src="portafolio-habilidades.pdf"></iframe>
    <div class="fallback" id="fallback">
        <p>Tu navegador no puede mostrar el PDF.</p>
        <p><a href="portafolio-habilidades.pdf" download>Descargar PDF ↓</a></p>
    </div>
    <script>
    const iframe = document.getElementById('pdfViewer');
    iframe.onerror = function() {
        iframe.style.display = 'none';
        document.getElementById('fallback').style.display = 'block';
    };
    </script>
</body>
</html>
