    };

    function getLabel(slug) {
      return labels[slug] || slug.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    }

    function buildBreadcrumb(path) {
      if (path === '/' || path === '') return '';
      
      const parts = path.split('/').filter(Boolean);
      let html = '<div class="breadcrumb"><a href="#/">Home</a>';
      let currentPath = '';
      
      parts.forEach((part, i) => {
        currentPath += '/' + part;
        const label = getLabel(part);
        html += '<span>/</span>';
        if (i === parts.length - 1) {
          html += label;
        } else {
          html += `<a href="#${currentPath}">${label}</a>`;
        }
      });
      
      return html + '</div>';
    }

    async function loadContent(path) {
      const file = routes[path] || routes['/'];
      try {
        const response = await fetch(file);
        if (!response.ok) throw new Error('Not found');
        const text = await response.text();
        const breadcrumb = buildBreadcrumb(path);
        document.getElementById('content').innerHTML = breadcrumb + marked.parse(text);
      } catch (e) {
        document.getElementById('content').innerHTML = '<h1>Page not found</h1>';
      }
    }

    function navigate() {
      const hash = window.location.hash.slice(1) || '/';
      loadContent(hash);
    }

    // Init
    document.getElementById('sidebar').innerHTML = sidebar;
    window.addEventListener('hashchange', navigate);
    navigate();
